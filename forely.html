<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {

      background: #fff7fb;
      text-align: center;
      padding: 60px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: #ffd6e8;
      transition: transform 0.05s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    #message {
      margin-top: 30px;
      font-size: 20px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <h1>Click for something happy 💌</h1>
  <button onclick="newMessage()">Click me</button>

  <div id="message"></div>

  <script>

    function newMessage() {
      const random = Math.floor(Math.random() * messages.length);
      document.getElementById("message").innerText = messages[random];

</body>
</html>
